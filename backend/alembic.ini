[alembic]
script_location = %(here)s/alembic
# Lets alembic/env.py import the app package (app.config).
# Split paths with the OS separator, not spaces: the repo path may contain spaces.
prepend_sys_path = %(here)s
path_separator = os
# The database URL is not stored here; alembic/env.py reads it from DATABASE_URL.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
