# Runs the same tools as CI, using the versions pinned in backend/uv.lock.
# Install the git hook once, from the repository root:
#   uv run --project backend pre-commit install
# Run on every file by hand:
#   uv run --project backend pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: uv run --directory backend ruff format --check
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
